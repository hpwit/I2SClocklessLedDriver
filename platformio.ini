[env]
framework = arduino
; platform = espressif32       ; error: 'xSemaphoreHandle' does not name a type; did you mean 'SemaphoreHandle_t'?, should work with #include "Arduino.h" ...
; platform = espressif32@6.5.0 ; works
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip ; check latest: https://github.com/pioarduino/platform-espressif32/releases
monitor_speed = 115200
build_flags = 
  -D PLATFORM_VERSION=\"pioarduino-55.03.37\" ; 🌙 make sure it matches with above plaftform
; lib_deps = 
;   FastLED/FastLED@3.10.3 ; used in hardwareSprite.h

[env:esp32dev]
board = esp32dev
build_flags = 
  ${env.build_flags}
  -D CONFIG_IDF_TARGET_ESP32=1

[env:esp-wrover-kit]
board = esp-wrover-kit
build_flags = 
  ${env.build_flags}
  -D CONFIG_IDF_TARGET_ESP32=1
  -DBOARD_HAS_PSRAM 
  -mfix-esp32-psram-cache-issue

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags = 
  ${env.build_flags}
  -D CONFIG_IDF_TARGET_ESP32S3=1
  -D ARDUINO_USB_MODE=1 ; which USB device classes are enabled on your ESP32 at boot. default 1 in board definition (serial only)
  -D ARDUINO_USB_CDC_ON_BOOT=1 ;Communications Device Class: controls whether the ESP32's USB serial port is enabled automatically at boot, default 1 in board definition
  -D ARDUINO_USB_MSC_ON_BOOT=0 ;Mass Storage Class, disable
  -D ARDUINO_USB_DFU_ON_BOOT=0 ;download firmware update, disable
  -D LOLIN_WIFI_FIX  ; some boards have wifi issues if this is not defined, this sets WIFI_POWER_8_5dBm

[env:esp32-p4]
board = esp32-p4-evboard
board_build.partitions  = default_16MB.csv
build_flags =
  ${env.build_flags}
  -D CONFIG_IDF_TARGET_ESP32P4=1
  -Wl,-wrap,esp_dma_capable_malloc ; makes SDIO for ESP-Hosted use PSRAM if available.

; ---------------------------------------------------------------------------
; Host-native test environment.  Runs the pure-logic unit tests in test/
; without any ESP32 hardware or toolchain.
;
; Usage:
;   pio test -e native
;
; Tests covered:
;   test/test_colorarrangement.cpp      — applyColorArrangement() for all 9 arrangements
;   test/test_parlio_p4_logic.cpp       — waveform cache, bit-transposition, data-width
;   test/test_first_index_per_output.cpp — firstIndexPerOutput[] cumulative-sum algorithm
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
  -std=c++11
  -I src
  -Wall
  -Wextra